<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일단</title>
<meta name="theme-color" content="#e9edf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일단">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon128.png">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: a quiet daily ledger led by one cobalt start card; a running timer takes over the screen. */
  :root {
    --bg: #e9edf5; --surface: #f7f9fc; --ink: #131a2e; --muted: #586079; --line: #c9d1e0;
    --accent: #1f3fd6; --on-accent: #ffffff;
    --flood: #1f3fd6; --on-flood: #ffffff; --on-flood-muted: #d3dcff;
    --h1: #1f3fd6; --h2: #c2410c; --h3: #0b7a75; --danger: #b42318;
    --display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1424; --surface: #171e33; --ink: #e8ecf6; --muted: #a0aac4; --line: #2c3552;
      --accent: #8ea6ff; --on-accent: #0f1424; --flood: #2440c9;
      --h1: #8ea6ff; --h2: #ff9a66; --h3: #4fd1c5; --danger: #ff9c8f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1424; --surface: #171e33; --ink: #e8ecf6; --muted: #a0aac4; --line: #2c3552;
    --accent: #8ea6ff; --on-accent: #0f1424; --flood: #2440c9;
    --h1: #8ea6ff; --h2: #ff9a66; --h3: #4fd1c5; --danger: #ff9c8f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
    word-break: keep-all; overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
  body:has(.flood) { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 6px; padding: 9px 14px; min-height: 44px; font-weight: 500;
    background: transparent; box-shadow: inset 0 0 0 1px var(--line); touch-action: manipulation; }
  button:active { opacity: .75; }
  button.solid { background: var(--accent); color: var(--on-accent); box-shadow: none; font-weight: 700; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input { width: 100%; min-width: 0; min-height: 44px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); font-size: 16px; } /* 16px 미만이면 아이폰이 입력 시 화면을 확대한다. */
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

  .page { max-width: 44rem; margin: 0 auto; display: grid; gap: 32px;
    padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
  .brand { font-family: var(--display); font-size: 1.75rem; margin: 0; font-weight: 400; }
  .date { color: var(--muted); font-size: 14px; }
  .next { font-size: 1.15rem; margin: 6px 0 0; width: 100%; text-wrap: balance; }
  h2 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .name { flex: 1 1 8rem; min-width: 0; }
  .name strong { display: block; font-weight: 700; }
  .name small { display: block; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 6px; }
  .stamp { font-weight: 700; color: var(--accent); padding: 8px 0; }
  .stamp.skipped { color: var(--muted); font-weight: 500; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }
  .pip.h0.on { background: var(--h1); box-shadow: none; }
  .pip.h1.on { background: var(--h2); box-shadow: none; }
  .pip.h2.on { background: var(--h3); box-shadow: none; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); }
  .day { background: var(--surface); border-radius: 4px; padding: 5px 4px 7px; display: grid; gap: 4px; justify-items: center; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
  .day.today { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); font-weight: 700; }
  .pips { display: flex; gap: 2px; }

  details { border-top: 1px solid var(--line); padding-top: 2px; }
  summary { cursor: pointer; color: var(--muted); min-height: 44px; display: flex; align-items: center; gap: 8px; }
  summary::before { content: "▸"; }
  details[open] summary::before { content: "▾"; }
  summary::-webkit-details-marker { display: none; }
  .settings { display: grid; gap: 14px; margin-top: 4px; }
  .habit { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 6px; }
  .numbers { display: grid; grid-template-columns: minmax(0, 10rem); gap: 10px; }
  .help { color: var(--muted); font-size: 14px; margin: 8px 0 0; max-width: 62ch; }
  .notice { color: var(--danger); font-size: 14px; margin: 0; }
  .saved { color: var(--muted); font-size: 14px; }
  .connect { display: grid; gap: 8px; padding: 14px; background: var(--surface); border-radius: 6px; }
  .connect-row { display: flex; gap: 8px; }
  .connect-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .linkbutton { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 14px; border-radius: 6px; font-weight: 500;
    color: var(--accent); text-decoration: none; box-shadow: inset 0 0 0 1px var(--accent); touch-action: manipulation; }
  .linkbutton:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .flood { position: fixed; inset: 0; z-index: 5; overflow: auto; overscroll-behavior: contain; background: var(--flood); color: var(--on-flood);
    display: grid; align-content: safe center; justify-items: start;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
  .poster { width: 100%; max-width: 44rem; margin: 0 auto; display: grid; gap: 8px; justify-items: start; }
  .eyebrow { color: var(--on-flood-muted); font-size: 1.05rem; }
  .hero { display: grid; gap: 4px; justify-items: start; padding: 20px; border-radius: 8px; background: var(--flood); color: var(--on-flood); }
  .hero-label { color: var(--on-flood-muted); font-size: 14px; }
  .hero-name { font-family: var(--display); font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1.1; overflow-wrap: anywhere; }
  .hero-step { font-weight: 700; font-size: 1.1rem; text-wrap: balance; }
  .hero-note { color: var(--on-flood-muted); font-size: 14px; }
  .hero button { margin-top: 12px; min-height: 56px; padding: 12px 32px; background: var(--on-flood); color: #1f3fd6;
    box-shadow: none; font-size: 1.2rem; font-weight: 700; }
  .hero button:focus-visible { outline-color: var(--on-flood); }
  .big { font-family: var(--display); font-size: clamp(4.5rem, 20vw, 10rem); line-height: 1.05; word-break: keep-all; overflow-wrap: anywhere; }
  .step { font-size: clamp(1.25rem, 4vw, 1.7rem); font-weight: 700; text-wrap: balance; }
  .small { color: var(--on-flood-muted); }
  .flood button { box-shadow: inset 0 0 0 1px var(--on-flood-muted); color: var(--on-flood); }
  .flood button.go { background: var(--on-flood); color: #1f3fd6; box-shadow: none; font-size: 1.35rem; font-weight: 700; padding: 16px 32px; margin-top: 14px; }
  .flood button.go:focus-visible, .flood button:focus-visible { outline-color: var(--on-flood); }
  .flood .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .clock { font-family: var(--display); font-size: clamp(4rem, 24vw, 13rem); line-height: 1; font-variant-numeric: tabular-nums; }

  /* 터치 기기에서는 PC 전용 알림 안내를 숨긴다. */
  @media (pointer: coarse) { #alertSection { display: none; } }

  /* 휴대폰 세로: 내용은 위, 버튼은 엄지가 닿는 아래. */
  @media (max-width: 40rem) and (min-height: 30.01rem) {
    .flood { display: flex; flex-direction: column; align-items: stretch; }
    .poster { flex: 1 0 auto; display: flex; flex-direction: column; align-items: stretch; max-width: none; }
    .poster > :first-child { margin-top: 12vh; }
    .flood button.go { width: 100%; margin-top: auto; min-height: 60px; }
    .flood .buttons { display: flex; margin-top: 2px; }
    .flood .buttons button { flex: 1 1 40%; }
    .flood .buttons.end { margin-top: auto; }
  }

  /* 휴대폰 가로: 내용과 버튼을 좌우로 나눈다. */
  @media (max-height: 30rem) {
    .flood { padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
    .poster { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(0, 15rem); column-gap: 20px; align-items: center; row-gap: 2px; }
    .poster > * { grid-column: 1; }
    .eyebrow { font-size: .95rem; }
    .big { font-size: clamp(2.6rem, 22vh, 5rem); }
    .step { font-size: 1.1rem; }
    .clock { font-size: clamp(3.5rem, 34vh, 7rem); }
    .flood button.go { grid-column: 2; grid-row: 1 / span 3; align-self: end; width: 100%; margin-top: 0; padding: 12px; font-size: 1.15rem; }
    .flood .buttons { grid-column: 2; grid-row: 4 / span 3; align-self: start; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
    .flood .buttons button { padding-inline: 6px; font-size: 14px; }
    .flood .buttons button:only-child { grid-column: 1 / -1; }
  }

  /* 좁은 화면의 홈과 설정. */
  @media (max-width: 30rem) {
    .page { gap: 26px; }
    .row { gap: 8px 10px; }
    .actions { flex: 1 1 100%; }
    .actions button { flex: 1 1 0; }
    .row .stamp { margin-left: auto; }
    .habit { grid-template-columns: minmax(0, 1fr); }
    .hero button { width: 100%; }
    .settings .actions { flex-wrap: wrap; }
    .settings .actions button { flex: 1 1 100%; }
    #saveSettings, #disconnect, #localOnly, .linkbutton { width: 100%; justify-content: center; }
    #connectButton { flex: none; }
    .connect-links { display: grid; }
    label { font-size: 12px; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<main class="page" id="home">
  <header>
    <h1 class="brand">일단</h1>
    <span class="date" id="date"></span>
    <p class="next" id="next">기록을 불러오는 중입니다.</p>
  </header>
  <section class="hero" id="hero" aria-label="다음 할 일" hidden></section>
  <p class="notice" id="notice" hidden></p>
  <section class="connect" id="connectBox" hidden aria-labelledby="connectTitle">
    <h2 id="connectTitle">PC와 휴대폰 기록 연결</h2>
    <p class="help">연결하지 않으면 이 브라우저에만 기록됩니다. gist 권한만 체크된 GitHub 토큰을 붙여 넣으세요. 토큰은 이 기기의 브라우저에만 저장됩니다.</p>
    <div class="connect-row">
      <input id="tokenInput" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="GitHub 토큰" placeholder="ghp_...">
      <button class="solid" id="connectButton" type="button">연결</button>
    </div>
    <div class="connect-links">
      <a class="linkbutton" href="https://github.com/settings/tokens/new?scopes=gist&amp;description=ildan" target="_blank" rel="noopener">GitHub 토큰 만들기</a>
      <button id="localOnly" type="button">이 기기에서만 쓰기</button>
    </div>
  </section>
  <section aria-labelledby="todayTitle">
    <h2 id="todayTitle">오늘</h2>
    <div id="today"></div>
  </section>
  <section aria-labelledby="monthTitle">
    <h2 id="monthTitle">이번 달</h2>
    <div class="legend" id="legend"></div>
    <div class="cal" id="calendar"></div>
  </section>
  <section id="alertSection">
    <button id="soundButton" type="button">알림 켜기</button>
    <p class="help" id="soundHelp">켜 두면 타이머가 끝났을 때 Windows 알림으로 알려 줍니다.</p>
  </section>
  <details id="settingsBox">
    <summary>설정</summary>
    <form class="settings" id="settings">
      <div>
        <h2>할 일</h2>
        <div id="habitFields" style="display:grid;gap:8px"></div>
        <p class="help">첫 단계는 하기 싫은 날에도 할 수 있을 만큼 작게 잡으세요.</p>
      </div>
      <div class="numbers">
        <label>타이머(분)<input id="startMinutes" type="number" inputmode="numeric" min="1" max="60" required></label>
      </div>
      <div class="actions">
        <button class="solid" type="submit" id="saveSettings">저장</button>
        <span class="saved" id="savedMessage" role="status"></span>
      </div>
      <div><button id="disconnect" type="button">기록 연결</button></div>
    </form>
  </details>
</main>

<script>
(() => {
  const DEFAULTS = {
    startMinutes: 2,
    habits: [
      { id: "study", name: "공부", firstStep: "책 펴고 한 문단만 읽기" },
      { id: "exercise", name: "운동", firstStep: "운동복 입고 스쿼트 5개" },
      { id: "clean", name: "청소", firstStep: "눈에 보이는 물건 3개 제자리에 두기" },
    ],
  };
  const MINUTE = 60000, DAY_START_HOUR = 4, DAY_MS = 86400000;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  // ---------- 판단 로직 ----------
  function dayKey(ms) {
    const d = new Date(ms - DAY_START_HOUR * 3600000);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  const isFinished = (entry) => entry?.status === "done" || entry?.status === "skipped";
  function missedYesterday(ms, id) {
    const today = dayKey(ms);
    if (!Object.keys(days).some((day) => day < today)) return false;
    return days[dayKey(ms - DAY_MS)]?.[id]?.status !== "done";
  }
  const durationText = (m) => (m >= 1 ? `${m}분` : `${Math.round(m * 60)}초`);
  const clockText = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;

  // ---------- 상태와 저장 ----------
  let config = DEFAULTS, days = {}, session = {};
  let appReady = false, daysReady = false, ticker = null, stageKey = "", settingsFilled = false;
  let queue = Promise.resolve();

  function showNotice(text) {
    $("notice").textContent = text;
    $("notice").hidden = !text;
  }
  function setSession(patch) {
    session = { ...session, ...patch };
    put("app/session", session);
    render();
  }
  function setEntry(habitId, patch, ms = Date.now()) {
    const key = dayKey(ms);
    const day = { ...days[key], [habitId]: { ...days[key]?.[habitId], ...patch } };
    days = { ...days, [key]: day };
    put(`days/${key}`, day);
  }
  const entryOf = (id, ms = Date.now()) => days[dayKey(ms)]?.[id] ?? {};
  const currentHabit = () => config.habits.find((h) => h.id === session.habitId);

  // ---------- 알림 ----------
  let audio = null;
  function enableAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
  }
  function beep() {
    if (!audio) return;
    [0, 0.22].forEach((delay) => {
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain).connect(audio.destination);
      osc.start(audio.currentTime + delay);
      osc.stop(audio.currentTime + delay + 0.16);
    });
  }
  function alertUser(message) {
    beep();
    try {
      if (window.Notification?.permission === "granted") new Notification("일단", { body: message });
    } catch {} // 휴대폰 브라우저는 페이지에서 직접 만든 알림을 막는다.
  }
  function refreshAlertButton() {
    const on = window.Notification?.permission === "granted";
    $("soundButton").hidden = on || !window.Notification;
    if (on) $("soundHelp").textContent = "알림이 켜져 있습니다.";
  }
  document.addEventListener("pointerdown", enableAudio, { once: true });
  $("soundButton").addEventListener("click", async () => {
    enableAudio();
    await window.Notification?.requestPermission();
    refreshAlertButton();
  });

  // ---------- 행동 ----------
  function startTimer(habitId) {
    setSession({ habitId, phase: "timer", day: dayKey(Date.now()), finishAt: Date.now() + config.startMinutes * MINUTE });
  }
  function completeTimer() {
    const entry = entryOf(session.habitId);
    const earlier = entry.status === "done" ? entry.minutes ?? 0 : 0; // 다시 시작한 시간은 그날 기록에 더한다.
    setEntry(session.habitId, { status: "done", minutes: earlier + Math.max(1, Math.round(config.startMinutes)) });
    setSession({ phase: "done" });
    alertUser(`${currentHabit()?.name ?? ""} 성공. 오늘 칸이 채워졌습니다.`);
  }
  function finishExtra() {
    const entry = entryOf(session.habitId);
    const added = Math.round((Date.now() - session.startedAt) / MINUTE);
    setEntry(session.habitId, { minutes: (entry.minutes ?? 0) + added });
    setSession({ phase: null });
  }
  function markDone(habitId) {
    const entry = entryOf(habitId);
    const earlier = entry.status === "done" ? entry.minutes ?? 0 : 0; // 이미 완료한 일은 시간을 더한다.
    setEntry(habitId, { status: "done", minutes: earlier + Math.max(1, Math.round(config.startMinutes)) });
    render();
  }

  // 타이머가 끝났는지 확인하고, 어제 남은 화면이나 이전 버전의 자동 화면을 닫는다.
  function check() {
    if (!appReady || !daysReady) return;
    const now = Date.now();
    if (session.phase === "timer" && now >= session.finishAt) completeTimer();
    if (session.phase && (session.phase === "prompt" || session.day !== dayKey(now) || !currentHabit())) setSession({ phase: null });
  }

  // ---------- 화면 ----------
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function btn(text, className, onClick) {
    const node = el("button", className, text);
    node.type = "button";
    node.addEventListener("click", onClick);
    return node;
  }

  function timerView(habit) {
    const poster = el("div", "poster");
    const clock = el("div", "clock");
    const paint = () => { clock.textContent = clockText(Math.max(0, Math.ceil((session.finishAt - Date.now()) / 1000))); };
    paint();
    ticker = setInterval(() => { paint(); if (Date.now() >= session.finishAt) check(); }, 250);
    const buttons = el("div", "buttons end");
    buttons.append(btn("취소", "", () => setSession({ phase: null })));
    poster.append(el("div", "eyebrow", habit.name), clock, el("div", "step", habit.firstStep),
      el("div", "small", "이 시간만 하면 오늘은 성공입니다."), buttons);
    return poster;
  }

  function doneView(habit) {
    const poster = el("div", "poster");
    poster.append(el("div", "big", "성공"), el("div", "step", `오늘 ${habit.name} 칸이 채워졌습니다.`),
      btn("더 할래", "go", () => setSession({ phase: "extra", startedAt: Date.now() })));
    const buttons = el("div", "buttons");
    buttons.append(btn("여기서 끝", "", () => setSession({ phase: null })));
    poster.append(buttons);
    return poster;
  }

  function extraView(habit) {
    const poster = el("div", "poster");
    const clock = el("div", "clock");
    const paint = () => { clock.textContent = `+${clockText(Math.floor((Date.now() - session.startedAt) / 1000))}`; };
    paint();
    ticker = setInterval(paint, 500);
    poster.append(el("div", "eyebrow", `${habit.name} 더 하는 중`), clock, btn("끝", "go", finishExtra));
    return poster;
  }

  function renderStage() {
    const habit = currentHabit();
    const phase = habit ? session.phase : null;
    const key = JSON.stringify([phase, habit, session.finishAt, session.startedAt, config.startMinutes]);
    if (key === stageKey) return;
    stageKey = key;
    clearInterval(ticker);
    $("stage").replaceChildren();
    $("home").inert = Boolean(phase);
    if (!phase) return;
    const view = { timer: timerView, done: doneView, extra: extraView }[phase];
    if (!view) return;
    const flood = el("div", "flood");
    flood.append(view(habit));
    $("stage").append(flood);
  }

  function renderToday(now) {
    const today = days[dayKey(now)] ?? {};
    const rows = config.habits.map((habit) => {
      const row = el("div", "row");
      const name = el("div", "name");
      name.append(el("strong", "", habit.name), el("small", "", habit.firstStep));
      row.append(name);
      const status = today[habit.id]?.status;
      const actions = el("div", "actions");
      if (status) {
        const minutes = today[habit.id]?.minutes;
        row.append(el("span", `stamp ${status}`, status === "done" ? `완료${minutes ? ` · ${minutes}분` : ""}` : "건너뜀"));
        actions.append(btn("다시 시작", "", () => startTimer(habit.id)), btn("완료", "", () => markDone(habit.id)));
      } else {
        actions.append(btn("시작", "solid", () => startTimer(habit.id)), btn("완료", "", () => markDone(habit.id)));
      }
      row.append(actions);
      return row;
    });
    $("today").replaceChildren(...rows);

    const waiting = config.habits.filter((h) => !isFinished(today[h.id]));
    const finished = config.habits.length - waiting.length;
    $("next").textContent = waiting.length
      ? (finished ? `${config.habits.length}개 중 ${finished}개를 마쳤습니다.` : "언제든 시작할 수 있습니다.")
      : "오늘 할 일을 모두 마쳤습니다.";
    renderHero(waiting[0], now);
  }

  function renderHero(habit, now) {
    const hero = $("hero");
    hero.hidden = !habit;
    if (!habit) { hero.replaceChildren(); return; }
    const duration = durationText(config.startMinutes);
    const nodes = [el("div", "hero-label", "다음 할 일"), el("div", "hero-name", habit.name), el("div", "hero-step", habit.firstStep)];
    if (missedYesterday(now, habit.id)) nodes.push(el("div", "hero-note", "어제 빠져도 괜찮아요. 오늘 하면 다시 이어집니다."));
    nodes.push(btn(`${duration}만 시작`, "", () => startTimer(habit.id)));
    hero.replaceChildren(...nodes);
  }

  function renderMonth(now) {
    const key = dayKey(now), [year, month] = key.split("-").map(Number);
    const counts = config.habits.map((h) => Object.entries(days)
      .filter(([day, e]) => day.startsWith(key.slice(0, 7)) && e[h.id]?.status === "done").length);
    $("legend").replaceChildren(...config.habits.map((h, i) => {
      const item = el("span");
      item.append(el("i", `pip h${i} on`), `${h.name} ${counts[i]}일`);
      return item;
    }));
    const cells = ["일", "월", "화", "수", "목", "금", "토"].map((d) => el("div", "dow", d));
    const lead = new Date(year, month - 1, 1).getDay();
    for (let i = 0; i < lead; i++) cells.push(el("div"));
    const total = new Date(year, month, 0).getDate();
    for (let d = 1; d <= total; d++) {
      const dayId = `${year}-${pad(month)}-${pad(d)}`;
      const cell = el("div", `day${dayId === key ? " today" : ""}`, String(d));
      const pips = el("div", "pips");
      config.habits.forEach((h, i) => pips.append(el("i", `pip h${i}${days[dayId]?.[h.id]?.status === "done" ? " on" : ""}`)));
      cell.append(pips);
      cells.push(cell);
    }
    $("calendar").replaceChildren(...cells);
    const shifted = new Date(now - DAY_START_HOUR * 3600000);
    $("date").textContent = `${month}월 ${shifted.getDate()}일 ${["일", "월", "화", "수", "목", "금", "토"][shifted.getDay()]}요일`;
    $("monthTitle").textContent = `${month}월 기록`;
  }

  function fillSettings() {
    const rows = config.habits.map((h) => {
      const row = el("div", "habit");
      row.dataset.id = h.id;
      [["name", h.name, "이름"], ["firstStep", h.firstStep, "첫 단계"]]
        .forEach(([key, value, label]) => {
          const input = el("input");
          input.id = `${h.id}-${key}`;
          input.type = "text";
          input.value = value;
          input.required = true;
          input.dataset.key = key;
          input.setAttribute("aria-label", `${h.name} ${label}`);
          row.append(input);
        });
      return row;
    });
    $("habitFields").replaceChildren(...rows);
    $("startMinutes").value = config.startMinutes;
  }

  function render() {
    const now = Date.now();
    renderStage();
    renderToday(now);
    renderMonth(now);
    if (!settingsFilled) { fillSettings(); settingsFilled = appReady; }
  }

  $("settings").addEventListener("submit", (event) => {
    event.preventDefault();
    const habits = [...document.querySelectorAll(".habit")].map((row) => {
      const value = (key) => row.querySelector(`[data-key=${key}]`).value.trim();
      return { id: row.dataset.id, name: value("name"), firstStep: value("firstStep") };
    });
    config = { ...config, habits, startMinutes: Number($("startMinutes").value) };
    put("app/config", config);
    $("savedMessage").textContent = "저장했습니다.";
    render();
  });

  // ---------- 저장: 브라우저에 먼저, 그다음 GitHub Gist ----------
  const API = "https://api.github.com";
  const STATE_KEY = "ildan-state", TOKEN_KEY = "ildan-token", LOCAL_KEY = "ildan-local";
  const GIST_DESCRIPTION = "ildan habit data", GIST_FILE = "ildan-data.json";
  const POLL_MS = 30000, PUSH_DELAY_MS = 1500, VERIFY_DELAY_MS = 2000;
  let docs = {}, dirty = new Set(), gistId = null, token = "", localOnly = false;
  let syncing = false, syncAgain = false, pushTimer = null;

  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
    remove(key) { try { localStorage.removeItem(key); } catch {} },
  };
  function persist() {
    storage.set(STATE_KEY, JSON.stringify({ docs, dirty: [...dirty], gistId }));
  }
  function put(path, body) {
    docs[path] = body;
    dirty.add(path);
    persist();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(sync, PUSH_DELAY_MS);
  }

  async function github(path, options = {}) {
    const res = await fetch(API + path, {
      ...options,
      cache: "no-cache",
      headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, ...options.headers },
    });
    if (res.status === 401) throw new Error("token");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  async function findGist() {
    for (let page = 1; page <= 10; page++) {
      const list = await github(`/gists?per_page=100&page=${page}`);
      const found = list.find((g) => g.description === GIST_DESCRIPTION && g.files[GIST_FILE]);
      if (found) return found.id;
      if (list.length < 100) break;
    }
    const created = await github("/gists", {
      method: "POST",
      body: JSON.stringify({
        description: GIST_DESCRIPTION, public: false,
        files: { [GIST_FILE]: { content: JSON.stringify({ docs }, null, 1) } },
      }),
    });
    return created.id;
  }

  // 같은 날 두 기기에서 고쳐도 할 일별로 합치고, 완료가 항상 이긴다.
  function mergeDoc(path, remote, local) {
    if (!path.startsWith("days/") || !remote) return local;
    const day = { ...remote };
    for (const [id, entry] of Object.entries(local)) {
      const other = remote[id] ?? {};
      day[id] = { ...other, ...entry };
      if (other.status === "done") day[id].status = "done";
      for (const field of ["minutes", "snoozes"]) {
        const value = Math.max(other[field] ?? 0, entry[field] ?? 0);
        if (value) day[id][field] = value;
      }
    }
    return day;
  }

  async function sync() {
    if (!token) return;
    if (syncing) { syncAgain = true; return; }
    syncing = true;
    try {
      if (!gistId) gistId = await findGist();
      const gist = await github(`/gists/${gistId}`);
      const merged = { ...JSON.parse(gist.files[GIST_FILE].content).docs };
      const sent = [...dirty].map((path) => [path, docs[path]]);
      for (const [path, body] of sent) merged[path] = mergeDoc(path, merged[path], body);
      if (sent.length) {
        await github(`/gists/${gistId}`, {
          method: "PATCH",
          body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify({ docs: merged }, null, 1) } } }),
        });
        // Gist에는 잠금이 없어 다른 기기가 같은 순간 덮어쓸 수 있으니, 남아 있는지 확인한다.
        await new Promise((resolve) => setTimeout(resolve, VERIFY_DELAY_MS));
        const saved = JSON.parse((await github(`/gists/${gistId}`)).files[GIST_FILE].content).docs;
        for (const [path, body] of sent) {
          const kept = JSON.stringify(mergeDoc(path, saved[path], body)) === JSON.stringify(saved[path])
            || !path.startsWith("days/");
          if (kept && docs[path] === body) dirty.delete(path);
          if (!kept) syncAgain = true;
          merged[path] = mergeDoc(path, saved[path], body);
        }
        for (const [path, body] of Object.entries(saved)) if (!sent.some(([p]) => p === path)) merged[path] = body;
      }
      for (const path of dirty) merged[path] = mergeDoc(path, merged[path], docs[path]);
      docs = merged;
      persist();
      applyDocs();
      showNotice("");
    } catch (error) {
      if (error.message === "token") {
        forgetToken();
        showNotice("토큰이 맞지 않거나 만료되었습니다. 새 토큰을 넣어 주세요.");
      } else {
        showNotice("지금은 동기화하지 못했습니다. 기록은 이 기기에 저장되어 있고 연결되면 다시 보냅니다.");
      }
    } finally {
      syncing = false;
      appReady = daysReady = true;
      check();
      if (syncAgain) { syncAgain = false; sync(); }
    }
  }

  function applyDocs() {
    if (docs["app/config"] && !$("settingsBox").open) {
      config = { ...DEFAULTS, ...docs["app/config"] };
      settingsFilled = false;
    }
    session = { ...docs["app/session"] };
    days = Object.fromEntries(Object.entries(docs)
      .filter(([key]) => key.startsWith("days/"))
      .map(([key, value]) => [key.slice(5), value]));
    render();
  }

  function showConnection() {
    $("connectBox").hidden = Boolean(token) || localOnly;
    $("disconnect").textContent = token ? "이 기기의 연결 해제" : "기록 연결";
  }
  function setLocalOnly(value) {
    localOnly = value;
    if (value) storage.set(LOCAL_KEY, "1");
    else storage.remove(LOCAL_KEY);
    showConnection();
    check();
  }
  function forgetToken() {
    token = "";
    gistId = null;
    storage.remove(TOKEN_KEY);
    persist();
    showConnection();
  }
  $("connectButton").addEventListener("click", () => {
    token = $("tokenInput").value.trim();
    $("tokenInput").value = "";
    if (!token) return;
    storage.set(TOKEN_KEY, token);
    localOnly = false;
    storage.remove(LOCAL_KEY);
    showConnection();
    sync(); // 토큰이 확인된 뒤에 sync가 check를 부른다.
  });
  $("localOnly").addEventListener("click", () => setLocalOnly(true));
  $("disconnect").addEventListener("click", () => {
    if (token) forgetToken();
    setLocalOnly(false);
    $("settingsBox").open = false;
    window.scrollTo(0, 0);
  });

  // ---------- 시작 ----------
  try {
    const saved = JSON.parse(storage.get(STATE_KEY) ?? "{}");
    docs = saved.docs ?? {};
    dirty = new Set(saved.dirty ?? []);
    gistId = saved.gistId ?? null;
  } catch {}
  token = storage.get(TOKEN_KEY) ?? "";
  localOnly = storage.get(LOCAL_KEY) === "1";
  showConnection();
  refreshAlertButton();
  applyDocs();
  if (token) sync();
  else { appReady = daysReady = true; check(); }
  setInterval(check, 5000);
  setInterval(render, 30000);
  setInterval(() => { if (!document.hidden) sync(); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { check(); sync(); } });
})();
</script>
</body>
</html>
